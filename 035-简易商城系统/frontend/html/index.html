<!doctype html>
<html>
  <head>
    <title>简易商城</title>
  </head>
  <body>
    <h1>简易商城系统</h1>
    <div id="products">加载中...</div>
    <script>
      fetch("/api/products")
        .then((r) => r.json())
        .then((d) => {
          document.getElementById("products").innerHTML = d
            .map((p) => `<div><h3>${p.name}</h3><p>¥${p.price}</p></div>`)
            .join("");
        })
        .catch(() => (document.getElementById("products").innerText = "请先启动后端"));
    </script>
  </body>
</html>
