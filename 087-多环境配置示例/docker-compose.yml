version: "3.8"
services:
  app-dev:
    build: .
    ports: ["3001:3000"]
    environment:
      - NODE_ENV=development
      - PORT=3000

  app-staging:
    build: .
    ports: ["3002:3000"]
    environment:
      - NODE_ENV=staging
      - PORT=3000

  app-prod:
    build: .
    ports: ["3003:3000"]
    environment:
      - NODE_ENV=production
      - PORT=3000
