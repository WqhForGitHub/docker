version: "3.8"
services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  blue:
    build: ./app
    environment:
      - COLOR=blue
    ports:
      - "8081:3000"

  green:
    build: ./app
    environment:
      - COLOR=green
    ports:
      - "8082:3000"
