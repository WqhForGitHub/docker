version: "3.8"
services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web1
      - web2

  web1:
    image: nginx:alpine
    volumes:
      - ./site1.html:/usr/share/nginx/html/index.html

  web2:
    image: nginx:alpine
    volumes:
      - ./site2.html:/usr/share/nginx/html/index.html
