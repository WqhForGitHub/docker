version: "3.8"
services:
  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  app:
    build: ./app
    ports:
      - "3000:3000"
    depends_on:
      - elasticsearch
    environment:
      - ES_URL=http://elasticsearch:9200

volumes:
  es_data:
