version: "3.8"
services:
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["3000:3000"]
    depends_on: [db, cache]
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://cache:6379

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    volumes: [db_data:/var/lib/mysql]

  cache:
    image: redis:alpine
    volumes: [cache_data:/data]

volumes:
  db_data:
  cache_data:
