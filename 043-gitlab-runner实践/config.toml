concurrent = 4
check_interval = 0
shutdown_timeout = 0

[session_server]
  listen_address = "[::]:8093"
  advertise_address = "runner:8093"
  session_timeout = 1800

[[runners]]
  name = "docker-runner"
  url = "https://gitlab.com/"
  token = "YOUR_TOKEN"
  executor = "docker"
  [runners.cache]
    MaxUploadedSize = 0
  [runners.docker]
    image = "alpine:latest"
    privileged = true
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
