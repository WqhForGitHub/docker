version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  producer:
    build: ./producer
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672

  consumer:
    build: ./consumer
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672

volumes:
  rabbitmq_data:
