version: "3.8"
services:
  app:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
