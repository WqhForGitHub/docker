version: "3.8"
services:
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web1
      - web2
      - web3

  web1:
    image: nginx:alpine
    volumes:
      - ./web1.html:/usr/share/nginx/html/index.html

  web2:
    image: nginx:alpine
    volumes:
      - ./web2.html:/usr/share/nginx/html/index.html

  web3:
    image: nginx:alpine
    volumes:
      - ./web3.html:/usr/share/nginx/html/index.html
