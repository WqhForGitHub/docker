version: "3.8"
services:
  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -dev -client=0.0.0.0
    volumes:
      - consul_data:/consul/data

  app:
    build: ./app
    ports:
      - "3000:3000"
    depends_on:
      - consul
    environment:
      - CONSUL_URL=http://consul:8500

volumes:
  consul_data:
