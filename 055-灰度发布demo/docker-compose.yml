version: "3.8"
services:
  router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-v1
      - app-v2

  app-v1:
    build:
      context: ./app
      args:
        VERSION: "v1.0"
    ports:
      - "8081:3000"

  app-v2:
    build:
      context: ./app
      args:
        VERSION: "v2.0"
    ports:
      - "8082:3000"
